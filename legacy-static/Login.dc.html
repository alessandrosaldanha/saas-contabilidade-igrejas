<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="./support.js"></script>
</head>

<body>
  <x-dc>
    <helmet>
      <link rel="stylesheet" href="_ds/ds-orla-5529f280-07c0-46b0-a23a-b29b19b0ccfb/tokens/fonts.css">
      <link rel="stylesheet" href="_ds/ds-orla-5529f280-07c0-46b0-a23a-b29b19b0ccfb/tokens/colors.css">
      <link rel="stylesheet" href="_ds/ds-orla-5529f280-07c0-46b0-a23a-b29b19b0ccfb/tokens/typography.css">
      <link rel="stylesheet" href="_ds/ds-orla-5529f280-07c0-46b0-a23a-b29b19b0ccfb/tokens/spacing.css">
      <link rel="stylesheet" href="_ds/ds-orla-5529f280-07c0-46b0-a23a-b29b19b0ccfb/tokens/effects.css">
      <link rel="stylesheet" href="_ds/ds-orla-5529f280-07c0-46b0-a23a-b29b19b0ccfb/tokens/base.css">
      <link rel="stylesheet" href="_ds/ds-orla-5529f280-07c0-46b0-a23a-b29b19b0ccfb/styles.css">
      <script src="_ds/ds-orla-5529f280-07c0-46b0-a23a-b29b19b0ccfb/_ds_bundle.js"></script>
      <style>
        body {
          margin: 0;
        }

        a {
          color: var(--orla-blue);
        }

        a:hover {
          color: var(--blue-300);
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </helmet>

    <div data-theme="{{ theme }}" style="display:flex; height:100vh; width:100%; font-family:var(--font-sans); overflow:hidden; box-sizing:border-box;">

      <div style="flex:1 1 46%; min-width:360px; position:relative; background:var(--orla-black); color:var(--orla-white); display:flex; flex-direction:column; justify-content:space-between; padding:48px; box-sizing:border-box; overflow:hidden;">
        <x-import component-from-global-scope="OrlaDesignSystem_5529f2.WavePattern" tone="paper" scale="1.1" opacity="0.08" fade="radial" hint-size="100%,100%"></x-import>

        <div style="position:relative; z-index:1; display:flex; align-items:center; gap:12px;">
          <x-import component-from-global-scope="OrlaDesignSystem_5529f2.WaveMark" size="26" color="var(--orla-white)" hint-size="26px,18px"></x-import>
          <span style="font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:-0.01em;">Contabilidade Ministerial</span>
        </div>

        <div style="position:relative; z-index:1; max-width:460px;">
          <p style="font-family:var(--font-display); font-weight:500; font-size:32px; line-height:1.28; letter-spacing:-0.01em; margin:0;">Gestão transparente, governança sólida e mordomia fiel para a sua igreja.</p>
        </div>

        <div style="position:relative; z-index:1; display:inline-flex; align-items:center; gap:8px; padding:8px 14px; border-radius:var(--radius-pill); border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.05); width:fit-content;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--neutral-300)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3Z"></path>
          </svg>
          <span style="font-size:var(--text-2xs); color:var(--neutral-300);">Plataforma protegida com criptografia de ponta a ponta</span>
        </div>
      </div>

      <div style="flex:1 1 54%; min-width:360px; background:var(--surface-page); color:var(--text-primary); display:flex; flex-direction:column; box-sizing:border-box; overflow-y:auto; transition:background var(--duration-normal) var(--ease-standard), color var(--duration-normal) var(--ease-standard);">
        <div style="display:flex; justify-content:flex-end; padding:24px 32px 0;">
          <button onClick="{{ toggleTheme }}" style="display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:var(--radius-pill); border:1px solid var(--border-default); background:var(--surface-card); color:var(--text-primary); cursor:pointer; font-family:var(--font-sans); font-size:var(--text-xs); font-weight:500;">
            <sc-if value="{{ isDarkTheme }}" hint-placeholder-val="{{ true }}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path>
                <circle cx="12" cy="12" r="4.5"></circle>
              </svg>
            </sc-if>
            <sc-if value="{{ isLightTheme }}" hint-placeholder-val="{{ false }}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"></path>
              </svg>
            </sc-if>
            {{ themeToggleLabel }}
          </button>
        </div>

        <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:24px 40px 60px;">
          <div style="width:100%; max-width:400px;">
            <h1 style="margin:0 0 6px; font-family:var(--font-display); font-weight:600; font-size:27px; color:var(--text-primary); letter-spacing:-0.01em;">Bem-vindo de volta</h1>
            <p style="margin:0 0 30px; font-size:var(--text-sm); color:var(--text-secondary);">Acesse o painel financeiro da sua igreja</p>

            <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex; align-items:flex-start; gap:10px; background:rgba(212,69,59,0.10); border:1px solid var(--status-error); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:20px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--status-error)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto; margin-top:1px;">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 8v5M12 16h.01"></path>
                </svg>
                <span style="font-size:var(--text-xs); color:var(--status-error); line-height:1.5;">{{ errorMessage }}</span>
              </div>
            </sc-if>

            <div style="display:flex; flex-direction:column; gap:16px; margin-bottom:6px;">
              <x-import component-from-global-scope="OrlaDesignSystem_5529f2.Input" label="E-mail Corporativo/Ministerial" type="email" placeholder="voce@igreja.org" value="{{ email }}" onChange="{{ onEmailChange }}" prefix="{{ mailIcon }}" hint-size="100%,64px"></x-import>

              <div>
                <x-import component-from-global-scope="OrlaDesignSystem_5529f2.Input" label="Senha de Acesso" type="{{ passwordFieldType }}" placeholder="••••••••" value="{{ password }}" onChange="{{ onPasswordChange }}" prefix="{{ lockIcon }}" suffix="{{ eyeToggle }}" hint-size="100%,64px"></x-import>
              </div>
            </div>

            <div style="display:flex; align-items:center; justify-content:space-between; margin:14px 0 22px;">
              <label style="display:flex; align-items:center; gap:8px; font-size:var(--text-xs); color:var(--text-secondary); cursor:pointer; user-select:none;">
                <input type="checkbox" checked="{{ remember }}" onChange="{{ onRememberChange }}" style="width:15px; height:15px; accent-color:var(--orla-blue); cursor:pointer;"></input>
                Lembrar neste dispositivo
              </label>
              <a href="#" style="font-size:var(--text-xs); text-decoration:none;">Esqueceu a senha?</a>
            </div>

            <x-import component-from-global-scope="OrlaDesignSystem_5529f2.Button" variant="primary" size="lg" fullWidth="{{ true }}" onClick="{{ onSubmit }}" disabled="{{ isLoading }}" hint-size="100%,48px">
              <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
                <span style="display:flex; align-items:center; gap:8px;">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="animation:spin 1s linear infinite;">
                    <circle cx="12" cy="12" r="9" stroke-dasharray="40 20"></circle>
                  </svg>
                  Autenticando…
                </span>
              </sc-if>
              <sc-if value="{{ isNotLoading }}" hint-placeholder-val="{{ true }}">Entrar na Plataforma</sc-if>
            </x-import>

          </div>
        </div>
      </div>
    </div>
  </x-dc>
  <script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: "dark", email: "", password: "", showPassword: false, remember: false, isLoading: false, errorMessage: "" };

  toggleTheme = () => this.setState({ theme: this.state.theme === "dark" ? "light" : "dark" });
  onEmailChange = (e) => this.setState({ email: e.target.value, errorMessage: "" });
  onPasswordChange = (e) => this.setState({ password: e.target.value, errorMessage: "" });
  onRememberChange = (e) => this.setState({ remember: e.target.checked });
  toggleShowPassword = () => this.setState((s) => ({ showPassword: !s.showPassword }));

  authenticate = (redirectDelay) => {
    if (!this.state.email.trim() || !this.state.password.trim()) {
      this.setState({ errorMessage: "Preencha e-mail e senha para continuar." });
      return;
    }
    this.setState({ isLoading: true, errorMessage: "" });
    setTimeout(() => {
      if (this.state.password.length < 6) {
        this.setState({ isLoading: false, errorMessage: "E-mail ou senha incorretos / Acesso negado pelo Keycloak." });
      } else {
        window.location.href = "Contabilidade Igreja.dc.html";
      }
    }, redirectDelay);
  };
  onSubmit = () => this.authenticate(1300);
  onSsoSubmit = () => this.authenticate(1500);

  renderVals() {
    const s = this.state;
    const isDark = s.theme === "dark";
    const mailIcon = React.createElement("svg", { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.75, strokeLinecap: "round", strokeLinejoin: "round" },
      React.createElement("rect", { x: 3, y: 5, width: 18, height: 14, rx: 2 }), React.createElement("path", { d: "m3 7 9 6 9-6" }));
    const lockIcon = React.createElement("svg", { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.75, strokeLinecap: "round", strokeLinejoin: "round" },
      React.createElement("rect", { x: 4, y: 11, width: 16, height: 9, rx: 2 }), React.createElement("path", { d: "M8 11V8a4 4 0 1 1 8 0v3" }));
    const eyeOpen = React.createElement("svg", { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.75, strokeLinecap: "round", strokeLinejoin: "round" },
      React.createElement("path", { d: "M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" }), React.createElement("circle", { cx: 12, cy: 12, r: 3 }));
    const eyeOff = React.createElement("svg", { width: 14, height: 14, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.75, strokeLinecap: "round", strokeLinejoin: "round" },
      React.createElement("path", { d: "M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M6.1 6.1C3.6 7.9 2 12 2 12s3.5 7 10 7c2 0 3.7-.5 5-1.3M17.9 17.9C20.4 16.1 22 12 22 12s-1.4-2.8-3.9-4.7" }));
    const eyeToggle = React.createElement("button", {
      type: "button", onClick: this.toggleShowPassword,
      style: { border: "none", background: "transparent", color: "var(--text-tertiary)", cursor: "pointer", display: "flex", padding: 0 },
    }, s.showPassword ? eyeOff : eyeOpen);

    return {
      theme: s.theme, toggleTheme: this.toggleTheme, isDarkTheme: isDark, isLightTheme: !isDark, themeToggleLabel: isDark ? "Modo escuro" : "Modo claro",
      email: s.email, password: s.password, onEmailChange: this.onEmailChange, onPasswordChange: this.onPasswordChange,
      passwordFieldType: s.showPassword ? "text" : "password",
      remember: s.remember, onRememberChange: this.onRememberChange,
      isLoading: s.isLoading, isNotLoading: !s.isLoading, onSubmit: this.onSubmit, onSsoSubmit: this.onSsoSubmit,
      hasError: !!s.errorMessage, errorMessage: s.errorMessage,
      mailIcon, lockIcon, eyeToggle,
    };
  }
}
</script>
</body>

</html>
